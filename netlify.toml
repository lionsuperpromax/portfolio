# Build + publish settings (Netlify also reads netlify.toml for these)
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# The GitHub proxy lives at /api/github, backed by the Netlify function.
[[redirects]]
  from = "/api/github"
  to = "/.netlify/functions/github"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
